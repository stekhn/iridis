      <stop offset="0.68" stop-color="#6a8fe2"/>
      <stop offset="1" stop-color="#7ad4c2"/>
    </linearGradient>
    <radialGradient id="h" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#fff2a8" stop-opacity="0.75"/>
